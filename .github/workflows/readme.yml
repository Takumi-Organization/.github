name: Regenerar README
on:
  push:
    branches: [main]
    paths: [projects.json, scripts/generate_readme.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/generate_readme.py
      - name: Commit si hay cambios
        run: |
          if [ -n "$(git status --porcelain profile/README.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add profile/README.md
            git commit -m "docs: regenerar README de la organización"
            git push
          fi
