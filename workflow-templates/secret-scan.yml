name: Análisis de secretos
on:
  push:
    branches: [$default-branch]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"
permissions:
  contents: read
jobs:
  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ficheros sensibles versionados
        run: |
          bad=$(git ls-files | grep -E '(^|/)(\.env(\..*)?|local\.properties|id_rsa.*|google-services\.json|.*\.(jks|keystore|p12))$' | grep -v '\.env\.example$' || true)
          if [ -n "$bad" ]; then echo "Ficheros sensibles versionados:"; echo "$bad"; exit 1; fi
      - name: Patrones de claves conocidas
        run: |
          pat='-----BEGIN [A-Z ]*PRIVATE KEY|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|sk-ant-[A-Za-z0-9_-]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}|AIza[0-9A-Za-z_-]{35}'
          if git grep -nIE -e "$pat" -- . ':!*.md'; then echo "Posible secreto versionado"; exit 1; fi
